<div id="kemasan" class="view">
  <style>
    /* tampilan lebih ringkas: dua kolom di layar lebar, tanpa scroll samping */
    #kemasan { max-width: 100%; overflow-x: hidden; }
    #kemasan .card { padding: 1rem; margin-bottom: 0.75rem; min-width: 0; }
    #kemasan .card-title { margin-bottom: 0.75rem; }
    #kemasan .input-group { gap: 0.25rem; margin-bottom: 0.5rem; min-width: 0; }
    #kemasan .input-group label { font-size: 0.75rem; }
    #kemasan .input-group input, #kemasan .input-group select { padding: 0.5rem 0.6rem; font-size: 0.95rem; width: 100%; min-width: 0; box-sizing: border-box; }
    #kemasan #kemasan-tgl { max-width: 240px; }
    #kemasan .row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
    #kemasan .row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
    #kemasan .sub-title { font-size: 0.8rem; margin: 0.75rem 0 0.35rem; }
    #kemasan .sub-tabs { flex-wrap: wrap; overflow-x: visible; }
    #kemasan .sub-tab { white-space: normal; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    #kemasan .km-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
    #kemasan .km-col { min-width: 0; }
    @media (max-width: 760px) { #kemasan .km-cols { grid-template-columns: minmax(0, 1fr); gap: 0; } }
    @media (max-width: 640px) { #kemasan .sub-tab { padding: 0.4rem 0.6rem; font-size: 0.75rem; } #kemasan .input-group input { padding: 0.5rem; font-size: 0.9rem; } }
  </style>
  <div class="view-toolbar">
    <button class="btn btn-sm btn-home" onclick="goHome()">← Menu</button>
    <span class="view-title">📦 Stok Kemasan (Mika)</span>
    <button class="btn btn-sm" onclick="openImportModal('kemasan')" style="margin-left:auto;flex:none;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;">📥 Import</button>
  </div>
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="showKemasanSubTab('k-input', this)">📝 Input Hari Ini</button>
    <button class="sub-tab" onclick="showKemasanSubTab('k-history', this)">📜 History Data</button>
  </div>

  <div id="k-input" class="k-panel active">
    <div class="card">
      <div class="card-title">📅 Tanggal Input Kemasan</div>
      <input type="date" id="kemasan-tgl" onchange="autoFillFromPanen(true)">
      <small style="color:#666;display:block;margin-top:0.5rem;">Tanggal diubah otomatis menarik data Kirim, Tamu, Keterangan &amp; Pemakaian Penunjang dari Rekap Panen.</small>
    </div>

    <div class="sub-tabs" id="input-kemasan-tabs">
      <button class="sub-tab active" onclick="showInputKemasanTab('hatsu', this)">📦 Mika Hatsu</button>
      <button class="sub-tab" onclick="showInputKemasanTab('gradea', this)">📦 Mika Grade A</button>
      <button class="sub-tab" onclick="showInputKemasanTab('gradeb', this)">📦 Mika Grade B</button>
      <button class="sub-tab" onclick="showInputKemasanTab('penunjang', this)">🧰 Penunjang</button>
    </div>

    <div id="forms-kemasan">
      <div id="input-panel-hatsu"     class="input-kemasan-panel" style="display:block;"></div>
      <div id="input-panel-gradea"    class="input-kemasan-panel" style="display:none;"></div>
      <div id="input-panel-gradeb"    class="input-kemasan-panel" style="display:none;"></div>
      <div id="input-panel-penunjang" class="input-kemasan-panel" style="display:none;"></div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="simpanDataKemasan()">💾 Simpan Semua Data Kemasan</button>
      <button class="btn btn-secondary" onclick="resetFormKemasan()">🔄 Reset Form</button>
    </div>
  </div>

  <div id="k-history" class="k-panel">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div class="card-title" style="margin-bottom: 0; border-bottom: none;">📜 History Transaksi Kemasan</div>
        <button class="btn btn-danger btn-sm" onclick="hapusSemuaHistoryKemasan()">🗑️ Hapus Semua History</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 60px;">Aksi</th>
              <th>Tanggal</th>
              <th>Hatsuhana (Dus/Pcs)</th>
              <th>Grade A (Dus/Pcs)</th>
              <th>Grade B (Dus/Pcs)</th>
              <th>Ringkasan Pengeluaran</th>
            </tr>
          </thead>
          <tbody id="tbl-kemasan-history-body">
            <tr><td colspan="6" class="text-center" style="color: #999;">Belum ada history</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
